<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - AI EXPLORER AGENCY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Jost:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo.png" alt="AI Explorer Logo" class="logo-img">
                <span class="agency-name">AI EXPLORER AGENCY</span>

        </div>
    </nav>

    <!-- Thank You Section -->
    <main class="hero">

            </div>

            <span class="hero-eyebrow">

            <h1 class="hero-title">
                Thank You

            <p class="hero-subtitle">
                Your project inquiry has been received.

            <p class="hero-description">
                Our team will review the details and get back to you soon.
            </p>

            <div class="hero-cta">

                    Back to Home

            <div class="footer-top">
                <div class="footer-brand">

                    <a href="index.html#services" class="footer-link">Services</a>
